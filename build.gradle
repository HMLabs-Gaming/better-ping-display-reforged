plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.21'
	id 'maven-publish'
}

version = "${project.mod_version}"
group = project.maven_group
minecraft_version = project.minecraft_version

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
	maven {
		name 'Xander Maven'
		url 'https://maven.isxander.dev/releases'
	}
}

loom {
	mods {
		"betterpingdisplay" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	runtimeOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	testImplementation 'junit:junit:4.13'
}

processResources {
	duplicatesStrategy = 'WARN'

	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version,
				"minecraft_version": minecraft_version
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	from "LICENSE"
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
	}
}

sourceSets {
	main.java {
		include 'com/vladmarica/betterpingdisplay/**/*'
		exclude 'net/fabricmc/*'
	}
	test.java {
		include 'com/vladmarica/betterpingdisplay/**/*'
	}
}

test {
	useJUnit()
}
